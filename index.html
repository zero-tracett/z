<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Trace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #03050a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Интерактивный фон с летающими призраками */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Кибер-сетка на фоне */
        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(43, 108, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(43, 108, 255, 0.04) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            z-index: 0;
            pointer-events: none;
        }

        /* Глубокое фоновое свечение */
        .ambient-light {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(43, 108, 255, 0.16) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        /* Контейнер для анимации появления */
        .wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Верхняя плашка предупреждения */
        .hint {
            width: 100%;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .hint-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .hint-text {
            font-size: 12.5px;
            color: #94a3b8;
            line-height: 1.45;
        }

        .hint-text b {
            color: #e2e8f0;
        }

        /* Главная 3D-карточка с бегущей неоновой рамкой */
        .card-border {
            position: relative;
            width: 100%;
            border-radius: 28px;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.5), rgba(43, 108, 255, 0.1) 40%, rgba(139, 92, 246, 0.4));
            box-shadow: 0 25px 70px -10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(43, 108, 255, 0.15);
            transition: transform 0.15s ease-out;
            transform-style: preserve-3d;
        }

        .card {
            background: rgba(9, 13, 24, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 26.5px;
            padding: 42px 28px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Внутренний блик сверху карточки */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.8), transparent);
        }

        /* Снежинка-логотип */
        .logo-box {
            width: 78px;
            height: 78px;
            margin: 0 auto 22px;
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(43, 108, 255, 0.2), rgba(14, 165, 233, 0.08));
            border: 1px solid rgba(125, 211, 252, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            position: relative;
            box-shadow: 0 0 35px rgba(43, 108, 255, 0.35), inset 0 0 15px rgba(125, 211, 252, 0.2);
            animation: pulseLogo 4s ease-in-out infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(43, 108, 255, 0.35); }
            50% { transform: scale(1.04); box-shadow: 0 0 50px rgba(56, 189, 248, 0.55); }
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(180deg, #ffffff 20%, #7dd3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
            font-weight: 500;
        }

        /* Бейдж пользователей с пульсирующим индикатором */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #bae6fd;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
            animation: blink 1.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Главная кнопка с эффектом блика */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            border: 1px solid rgba(186, 230, 253, 0.4);
            color: #ffffff;
            font-size: 16.5px;
            font-weight: 700;
            text-decoration: none;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 12px 30px -5px rgba(37, 99, 235, 0.6);
        }

        /* Бегущий блик по кнопке */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            transform: skewX(-25deg);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            25%, 100% { left: 160%; }
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 18px 40px -5px rgba(56, 189, 248, 0.75);
            background: linear-gradient(135deg, #3b82f6 0%, #0ea5e9 100%);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Футер */
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }

        .tg-icon {
            width: 14px;
            height: 14px;
            fill: #38bdf8;
        }

        @media (max-width: 480px) {
            body { justify-content: flex-start; padding-top: 28px; }
            .card { padding: 34px 20px 26px; }
            .title { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="cyber-grid"></div>
    <div class="ambient-light"></div>
    <canvas id="bg-canvas"></canvas>

    <div class="wrapper">
        <!-- ПОДСКАЗКА СВЕРХУ -->
        <div class="hint">
            <div class="hint-title">⚠️ Не открывается?</div>
            <div class="hint-text">
                Нажми на <b>⋯</b> в правом верхнем углу и выбери <b>«Открыть в браузере»</b>.
            </div>
        </div>

        <!-- ОСНОВНАЯ КАРТОЧКА -->
        <div class="card-border" id="tilt-card">
            <div class="card">
                <div class="logo-box">❄️</div>
                <h1 class="title">Zero-Trace</h1>
                <p class="subtitle">Выбери нужный раздел ниже</p>
                
                <div class="badge">
                    <span class="live-dot"></span>
                    50 000+ активных пользователей
                </div>

                <a class="btn"
                   href="https://t.me/zerotrrace_bot?start=ref_eI9i2LrNLoD-_jvVmM6akJA"
                   target="_blank"
                   rel="noopener">
                    <span>💎</span> бот для сноса <span>❄️</span>
                </a>

                <div class="footer">
                    <svg class="tg-icon" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
                    Быстрый переход через Telegram
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Интерактивный фон с призраками и частицами
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Класс летающего призрака
        class Ghost {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            reset() {
                this.size = 24 + Math.random() * 18;
                this.vx = (Math.random() - 0.5) * 1.1;
                this.vy = (Math.random() - 0.5) * 1.1;
                this.alpha = 0.15 + Math.random() * 0.22;
                this.angle = Math.random() * Math.PI * 2;
            }
            update() {
                this.angle += 0.02;
                this.x += this.vx + Math.sin(this.angle) * 0.3;
                this.y += this.vy + Math.cos(this.angle) * 0.3;

                // Отталкивание от курсора
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 130) {
                    const force = (130 - dist) / 130;
                    this.x += (dx / dist) * force * 3;
                    this.y += (dy / dist) * force * 3;
                }

                // Отскок от границ экрана
                if (this.x < 30 || this.x > width - 30) this.vx *= -1;
                if (this.y < 30 || this.y > height - 30) this.vy *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 15;
                ctx.fillText('👻', this.x, this.y);
                ctx.restore();
            }
        }

        // Класс светящихся частиц
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.r = Math.random() * 2 + 0.5;
                this.vy = -Math.random() * 0.6 - 0.2;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.vy;
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(125, 211, 252, ${this.alpha})`;
                ctx.fill();
            }
        }

        const ghostCount = window.innerWidth < 500 ? 7 : 12;
        const ghosts = Array.from({ length: ghostCount }, () => new Ghost());
        const particles = Array.from({ length: 45 }, () => new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            ghosts.forEach(g => { g.update(); g.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        // 2. 3D-наклон карточки за курсором
        const card = document.getElementById('tilt-card');
        document.addEventListener('mousemove', e => {
            if (window.innerWidth < 600) return;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const rotateX = (-y / 25).toFixed(2);
            const rotateY = (x / 25).toFixed(2);
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    </script>
</body>
</html>
